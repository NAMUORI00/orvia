<section id="usage-view" data-lab="{{lab.id}}" class="card card-pad">
  <div class="usage-heading">
    <h2>저장공간 분석</h2>
    <span id="usage-time">집계 대기</span>
  </div>
  <p class="muted">
    그래프에 마우스를 올리거나 터치하면 수치를 확인할 수 있습니다.
  </p>
  <div class="storage-overview">
    <div class="storage-gauge">
      <svg
        id="usage-gauge"
        viewBox="0 0 180 180"
        role="img"
        tabindex="0"
        aria-label="저장공간 사용률"
      ></svg
      ><button type="button" id="usage-detail-open" class="secondary">
        용량 상세
      </button>
    </div>
    <div class="storage-distribution">
      <h3>사용자별 점유율</h3>
      <svg
        id="usage-allocation"
        viewBox="0 0 1000 100"
        preserveAspectRatio="none"
        role="img"
        aria-label="사용자별 저장공간 점유율"
      ></svg>
      <div id="usage-accounts" class="usage-accounts"></div>
      <p class="muted">사용자를 선택하면 하위 경로를 확인할 수 있습니다.</p>
    </div>
  </div>
  <p id="usage-state" role="status">
    집계 중에는 다른 화면을 이용할 수 있습니다.
  </p>
  <section id="usage-path-panel" hidden>
    <div class="usage-heading">
      <h3 id="usage-path">서버 저장 경로</h3>
      <button type="button" id="usage-up" class="secondary">상위 폴더 ↑</button>
    </div>
    <code id="usage-host" class="host-storage-path">{{lab.storage_path}}</code>
    <div id="usage-paths" class="usage-paths"></div>
  </section>
  <details>
    <summary>집계 기준</summary>
    <p class="muted">
      파일 내용은 읽지 않습니다. 기본 15분 간격으로 갱신하며, 변경 중인
      파일·관리 영역·파일시스템 정보로 전체 사용량과 차이가 날 수 있습니다. 숨김
      캐시를 포함하며 심볼릭 링크는 따라가지 않습니다.
    </p>
  </details>
</section>
<dialog id="usage-detail" class="insight-dialog">
  <div class="usage-heading">
    <h2>용량 상세</h2>
    <button
      type="button"
      id="usage-detail-close"
      class="secondary"
      aria-label="닫기"
    >
      ✕
    </button>
  </div>
  <dl id="usage-detail-values" class="detail-values"></dl>
</dialog>
<script defer src="/static/visual-metrics.js"></script>
<script defer src="/static/storage-usage.js"></script>
