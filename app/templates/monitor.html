{% extends 'base.html' %}{% block content %}
<section class="page-head monitor-head">
  <div>
    <p class="eyebrow">ORVIA</p>
    <h1>운영 현황</h1>
  </div>
  <div class="monitor-tools">
    <label
      >조회 기간<select id="monitor-window">
        <option value="2">최근 2시간</option>
        <option value="24">최근 24시간</option>
        <option value="168">최근 7일</option>
        <option value="custom">날짜 선택</option>
      </select></label
    ><button type="button" id="monitor-health" class="health-pill">
      수집 대기
    </button>
  </div>
</section>
<form id="history-range" class="monitor-tools" hidden>
  <label>시작 날짜<input id="history-start" type="date" required /></label>
  <label>종료 날짜<input id="history-end" type="date" required /></label>
  <button type="submit">조회</button
  ><span class="muted">최대 31일 · 현지 시간 기준</span>
</form>
<p id="history-summary" class="muted"></p>
<div class="monitor-meta">
  <span id="monitor-time">수집 대기</span
  ><span>그래프에 마우스를 올리거나 터치하면 수치를 확인할 수 있습니다.</span>
</div>
<div id="monitor-overview" class="overview-metrics"></div>
<section class="card card-pad network-overview">
  <div class="usage-heading">
    <h2>네트워크 사용량</h2>
    <span class="muted">기간 누적 · 사용자 선택</span>
  </div>
  <div class="network-legend"><span>● 수신</span><span>● 송신</span></div>
  <div id="network-ranking" class="network-ranking"></div>
</section>
<section class="card card-pad account-overview">
  <div class="usage-heading">
    <h2>사용자 활동</h2>
    <span class="muted">사용자 선택 · 상세 지표</span>
  </div>
  <div id="monitor-users" class="account-map"></div>
</section>
<div class="monitor-actions">
  <button id="monitor-hardware-open" class="secondary" type="button">
    하드웨어</button
  ><button id="monitor-events-open" class="secondary" type="button">
    변경 기록</button
  ><button id="monitor-info-open" class="secondary" type="button">
    집계 기준
  </button>
  <button id="retention-open" type="button" class="secondary">기록 보관</button>
</div>
<dialog id="retention-dialog" class="insight-dialog">
  <form id="retention-form">
    <input type="hidden" name="csrf" value="{{session.csrf}}" />
    <h2>기록 보관</h2>
    <p>기본 설정: 상세 7일 · 요약 90일. 수집은 1분, 요약은 15분 간격입니다.</p>
    <label
      >상세 기록<select id="raw-days">
        <option value="1">1일</option>
        <option value="3">3일</option>
        <option value="7">7일</option>
      </select></label
    >
    <label
      >전체 보관 기간<select id="archive-days">
        <option value="30">30일</option>
        <option value="60">60일</option>
        <option value="90">90일</option>
        <option value="180">180일</option>
      </select></label
    >
    <p>
      기간을 줄이면 초과 기록이 자동 삭제됩니다. 삭제된 기록은 복원되지
      않습니다.
    </p>
    <label
      ><input id="retention-ack" type="checkbox" />보관 기간과 자동 삭제를
      확인했습니다.</label
    >
    <p id="retention-result" role="status"></p>
    <button type="submit">저장</button
    ><button type="button" id="retention-close" class="secondary">닫기</button>
  </form>
</dialog>
<p id="monitor-error" role="status"></p>
<dialog id="monitor-detail" class="insight-dialog">
  <div class="usage-heading">
    <h2 id="detail-title"></h2>
    <button type="button" id="detail-close" class="secondary" aria-label="닫기">
      ✕
    </button>
  </div>
  <div id="detail-body"></div>
</dialog>
<script defer src="/static/visual-metrics.js"></script>
<script defer src="/static/monitor.js"></script>
{% endblock %}
